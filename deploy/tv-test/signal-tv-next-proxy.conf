# Shared by the /tv-test sidecar locations (signal-tv-next.service on 127.0.0.1:8792).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host 127.0.0.1:8792;
proxy_set_header Authorization "";          # never pass Basic Auth credentials on
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header Forwarded "";
proxy_redirect off;
proxy_connect_timeout 3s;
proxy_read_timeout 60s;
# the site's security headers, without the page's "no-cache": artwork is immutable per URL
include snippets/signal-tv-headers.conf;
