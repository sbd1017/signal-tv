[Service]
# /tv behind the central example.com login: the app checks nginx's identity headers itself, and accepts them
# only with this key (X-Site-Proxy-Key, sent by nginx from snippets/signal-tv-proxy-key.conf; deploy/tv-keys.sh)
Environment=SITE_AUTH=1
LoadCredential=site-proxy-key:/etc/signal-tv/site-proxy-key
