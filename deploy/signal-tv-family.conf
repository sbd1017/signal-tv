# Family site @NAME@ (tvapp/family.py): /@NAME@/ -> signal-tv-family@@NAME@ (127.0.0.1:@PORT@).
# Generated from deploy/signal-tv-family.conf by deploy/family.sh (`iptv family add @NAME@`) into
# snippets/signal-tv-family-@NAME@.conf, which snippets/signal-tv.conf includes.
# No Basic Auth: the app shows its own passphrase page and checks its session cookie on every
# request; the artwork sidecar (not the app) is checked here, by auth_request.
# The app sees /tv/...; nginx maps /@NAME@/ onto it.
# auth_request off: a site-wide sign-in in front of the whole server (if there is one) never applies
# here - the passphrase is the site's own. "#@site-auth@" lines are switched on by family.sh only when
# nginx already has that sign-in's pieces (its @family_unauthorized location); otherwise they stay comments.

location = /@NAME@ {
    auth_request off;
    include snippets/signal-tv-headers.conf;
    return 308 /@NAME@/;
}

location = /_@NAME@_session {
    auth_request off;
    internal;
    proxy_pass http://127.0.0.1:@PORT@/tv/api/auth-check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host 127.0.0.1:@PORT@;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
}

location ^~ /@NAME@/ {
    auth_request off;
    #@site-auth@ error_page 401 = @family_unauthorized;     # on with a site-wide sign-in that defines it (deploy/family.sh)
    access_log /var/log/nginx/signal-tv.access.log signal_tv;
    error_log /var/log/nginx/signal-tv.error.log crit;
    limit_conn signal_tv_conn 40;
    limit_conn_status 429;
    limit_req zone=signal_tv burst=200 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:@PORT@/tv/;
    include snippets/signal-tv-proxy.conf;
    proxy_set_header X-TV-Auth-User "";
    proxy_read_timeout 75s;
    client_max_body_size 1k;

    location ^~ /@NAME@/api/login {          # the passphrase form: a few tries a second at most (the app limits wrong ones too)
        limit_req zone=signal_tv_play burst=5 nodelay;
        proxy_pass http://127.0.0.1:@PORT@/tv/api/login;
        include snippets/signal-tv-proxy.conf;
        proxy_set_header X-TV-Auth-User "";
    }

    location ^~ /@NAME@/api/state {          # synced state: small JSON POSTs, backup-file import
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:@PORT@/tv/api/state;
        include snippets/signal-tv-proxy.conf;
        proxy_set_header X-TV-Auth-User "";
    }

    location ^~ /@NAME@/api/img/ {
        limit_conn signal_tv_img_conn 200;
        limit_req zone=signal_tv_img burst=1000 nodelay;
        proxy_pass http://127.0.0.1:@PORT@/tv/api/img/;
        include snippets/signal-tv-proxy.conf;
        proxy_set_header X-TV-Auth-User "";
    }

    location ^~ /@NAME@/api/play/ {
        limit_req zone=signal_tv_play burst=12 nodelay;
        proxy_pass http://127.0.0.1:@PORT@/tv/api/play/;
        include snippets/signal-tv-proxy.conf;
        proxy_set_header X-TV-Auth-User "";
        proxy_read_timeout 75s;
    }

    location ^~ /@NAME@/m/ {                 # media: signed token in the path
        limit_req zone=signal_tv_media burst=240 nodelay;
        proxy_pass http://127.0.0.1:@PORT@/tv/m/;
        include snippets/signal-tv-proxy.conf;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 120s;
    }

    location ^~ /@NAME@/next/ {              # the shared artwork sidecar, for this site's signed-in devices
        auth_request /_@NAME@_session;
        limit_conn signal_tv_img_conn 200;
        limit_req zone=signal_tv_img burst=1000 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8792;
        include snippets/signal-tv-next-proxy.conf;
    }

    location ^~ /@NAME@/pwa/ {               # manifest, icons and the passphrase page's stylesheet: public
        proxy_pass http://127.0.0.1:@PORT@/tv/pwa/;
        include snippets/signal-tv-proxy.conf;
    }
}
