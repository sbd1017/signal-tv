# Signal TV: /tv -> signal-tv.service (127.0.0.1:8790). Included from
# sites-available/example.com.conf. Only GET/HEAD reach it (server-level map), except
# POST to /tv/api/state and /tv/api/state/import (synced favourites/progress; the map in
# conf.d/10-site.conf has a line for exactly those two paths).
#
# Login: the site's existing Basic Auth (snippets/site-basic-auth.conf), OR the
# app's signed 30-day session cookie, which the app issues only to a request that
# passed Basic Auth (nginx forwards the authenticated user in X-TV-Auth-User).
# The cookie is checked by auth_request so the home-screen app needn't re-login.
# /tv/m/ (video) is authorised by short-lived signed tokens in the path instead,
# because native players / PiP / AirPlay do not reliably send credentials.

location = /tv {
    include snippets/signal-tv-headers.conf;
    try_files /.__site_redirect_not_a_file @site_tv_slash;
}

location = /_tv_session {
    internal;
    auth_request off;
    return 404;
    proxy_pass http://127.0.0.1:8790/tv/api/auth-check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "";
    proxy_set_header Host 127.0.0.1:8790;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
}

location ^~ /tv/ {
    access_log /var/log/nginx/signal-tv.access.log signal_tv;
    error_log /var/log/nginx/signal-tv.error.log crit;
    satisfy all;
    # Site-wide authentication inherited.
    # Owner TV uses the central session only.
    limit_conn signal_tv_conn 40;
    limit_conn_status 429;
    limit_req zone=signal_tv burst=200 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8790;
    include snippets/signal-tv-proxy.conf;
    proxy_set_header X-TV-Auth-User $site_user;
    include snippets/site-identity.conf;   # the central login, for the app to check
    include snippets/signal-tv-proxy-key.conf;    # X-Site-Proxy-Key (root 0600, deploy/tv-keys.sh)
    proxy_read_timeout 75s;                  # /tv/api/play waits for a stream to start
    client_max_body_size 1k;                 # no uploads anywhere under /tv except below

    location ^~ /tv/api/state {              # synced state: small JSON POSTs, backup-file import
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8790;
        include snippets/signal-tv-proxy.conf;
        proxy_set_header X-TV-Auth-User $site_user;
        include snippets/site-identity.conf;   # the central login, for the app to check
        include snippets/signal-tv-proxy-key.conf;    # X-Site-Proxy-Key (root 0600, deploy/tv-keys.sh)
    }

    location ^~ /tv/api/img/ {               # artwork: own buckets (30-signal-tv.conf), not the page's
        limit_conn signal_tv_img_conn 200;
        limit_req zone=signal_tv_img burst=1000 nodelay;
        proxy_pass http://127.0.0.1:8790;
        include snippets/signal-tv-proxy.conf;
        proxy_set_header X-TV-Auth-User $site_user;
        include snippets/site-identity.conf;   # the central login, for the app to check
        include snippets/signal-tv-proxy-key.conf;    # X-Site-Proxy-Key (root 0600, deploy/tv-keys.sh)
    }

    location ^~ /tv/api/play/ {              # starting streams: a few per second is plenty
        limit_req zone=signal_tv_play burst=12 nodelay;
        proxy_pass http://127.0.0.1:8790;
        include snippets/signal-tv-proxy.conf;
        proxy_set_header X-TV-Auth-User $site_user;
        include snippets/site-identity.conf;   # the central login, for the app to check
        include snippets/signal-tv-proxy-key.conf;    # X-Site-Proxy-Key (root 0600, deploy/tv-keys.sh)
        proxy_read_timeout 75s;
    }

    location ^~ /tv/m/ {                     # media: signed token in the path, no login
        auth_basic off;
        auth_request off;
        satisfy all;
        limit_req zone=signal_tv_media burst=240 nodelay;
        proxy_pass http://127.0.0.1:8790;
        include snippets/signal-tv-proxy.conf;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 120s;
    }

    # The new interface's sidecar (signal-tv-next.service): resized artwork, sports crests and
    # artwork-gap reports. Same login as the page (inherited). The site's method map needs:
    #     "POST:/tv/next/api/art/gaps" 1;
    location ^~ /tv/next/ {
        limit_conn signal_tv_img_conn 200;  # artwork: own buckets (30-signal-tv.conf), not the page's
        limit_req zone=signal_tv_img burst=1000 nodelay;
        client_max_body_size 64k;            # gap reports: at most 200 small JSON items
        proxy_pass http://127.0.0.1:8792;
        include snippets/signal-tv-next-proxy.conf;
        include snippets/site-identity.conf;   # owner-only sidecar routes (Add crest) check the login
        include snippets/signal-tv-proxy-key.conf;
    }

    location ^~ /tv/pwa/ {                   # manifest + icons: iOS fetches them without credentials
        auth_basic off;
        # Central session inherited.
        satisfy all;
        proxy_pass http://127.0.0.1:8790;
        include snippets/signal-tv-proxy.conf;
        # Exact installation metadata fetched by iOS without browser cookies.
        location = /tv/pwa/manifest.webmanifest {
            auth_request off;
            proxy_pass http://127.0.0.1:8790;
            include snippets/signal-tv-proxy.conf;
        }
        location = /tv/pwa/apple-touch-icon.png {
            auth_request off;
            proxy_pass http://127.0.0.1:8790;
            include snippets/signal-tv-proxy.conf;
        }
        location = /tv/pwa/icon-192.png {
            auth_request off;
            proxy_pass http://127.0.0.1:8790;
            include snippets/signal-tv-proxy.conf;
        }
        location = /tv/pwa/icon-512.png {
            auth_request off;
            proxy_pass http://127.0.0.1:8790;
            include snippets/signal-tv-proxy.conf;
        }
        location = /tv/pwa/icon-maskable-512.png {
            auth_request off;
            proxy_pass http://127.0.0.1:8790;
            include snippets/signal-tv-proxy.conf;
        }
        location = /tv/pwa/new/manifest.webmanifest {
            auth_request off;
            proxy_pass http://127.0.0.1:8790;
            include snippets/signal-tv-proxy.conf;
        }
        location = /tv/pwa/new/apple-touch-icon.png {
            auth_request off;
            proxy_pass http://127.0.0.1:8790;
            include snippets/signal-tv-proxy.conf;
        }
        location = /tv/pwa/new/icon-192.png {
            auth_request off;
            proxy_pass http://127.0.0.1:8790;
            include snippets/signal-tv-proxy.conf;
        }
        location = /tv/pwa/new/icon-512.png {
            auth_request off;
            proxy_pass http://127.0.0.1:8790;
            include snippets/signal-tv-proxy.conf;
        }
        location = /tv/pwa/new/icon-maskable-512.png {
            auth_request off;
            proxy_pass http://127.0.0.1:8790;
            include snippets/signal-tv-proxy.conf;
        }
        location = /tv/pwa/new/icon.svg {
            auth_request off;
            proxy_pass http://127.0.0.1:8790;
            include snippets/signal-tv-proxy.conf;
        }

    }
}

# family sites (deploy/family.sh, `iptv family add <site>`): one generated snippet each, at their own address
include snippets/signal-tv-family-*.conf;
